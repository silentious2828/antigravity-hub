name: OmniRoute Hub CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python test_triage_shim.py
      - run: python audit/verify_chain.py
