[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent-kit"
version = "0.1.0"
description = "Google Cloud Data Agent Kit"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gcp = [
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=3.1.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-pubsub>=2.25.0",
    "google-cloud-secret-manager>=2.20.0",
]
bigquery = ["google-cloud-bigquery>=3.25.0"]
storage = ["google-cloud-storage>=3.1.0"]
logging = ["google-cloud-logging>=3.10.0"]
pubsub = ["google-cloud-pubsub>=2.25.0"]
secret = ["google-cloud-secret-manager>=2.20.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
data-agent = "data_agent_kit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: marks tests as integration tests that hit real GCP",
]
